<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';">
		<title>Radolfa Desktop — настройка</title>
		<link rel="stylesheet" href="desktop.css">
		<script src="ui.js" defer></script>
		<script src="setup.js" defer></script>
	</head>
	<body>
		<main>
			<div class="language"><button data-language="ru">Русский</button><button data-language="tg">Тоҷикӣ</button></div>
			<h1 data-text="setup"></h1>
			<p data-text="setupHint"></p>
			<form id="server-form">
				<label for="server-url" data-text="server"></label>
				<input id="server-url" type="text" placeholder="https://shop.example.com" autocomplete="off" required>
				<label for="installation-pin" data-text="pin"></label>
				<input id="installation-pin" type="password" minlength="6" maxlength="128" autocomplete="off" aria-describedby="pin-hint" required>
				<p id="pin-hint" class="hint" data-text="pinNew"></p>
				<div class="actions">
					<button class="primary" type="submit" data-text="launch"></button>
					<button id="open-saved" type="button" data-text="cancel" hidden></button>
				</div>
			</form>
			<p id="status" class="status" role="status" aria-live="polite"></p>
		</main>
	</body>
</html>
